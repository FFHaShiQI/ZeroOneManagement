spring:
  application:
    name: zero-one-management
  # 配置数据库信息
  datasource:
    url: jdbc:mysql://localhost:3306/zeroonestars
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  servlet:
    multipart:
      # 设置springboot项目中最大单个文件大小
      max-file-size: 10MB
      # 设置最大请求大小（包括所有文件和表单数据）
      max-request-size: 100MB

# mybatis相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true  # 开启驼峰命名自动识别

# 配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

